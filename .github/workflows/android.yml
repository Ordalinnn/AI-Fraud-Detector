name: Android app

# Builds the Android app (android/), runs its unit tests - including the
# check that the on-device model gives the same probabilities as the
# scikit-learn model - and publishes the APK so it can be installed on a
# phone straight from the Releases page.

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unit tests and APK
        run: |
          set -o pipefail
          gradle -p android --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee gradle.log || {
            # Surface compiler/build errors as annotations (readable from the PR page).
            { grep -E "^e: |FAILED" gradle.log | head -15; grep -A12 "What went wrong" gradle.log | head -30; } | while IFS= read -r l; do
              echo "::error title=gradle::${l:0:400}"
            done
            exit 1
          }

      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          tests = fails = 0
          for f in glob.glob("android/app/build/test-results/testDebugUnitTest/*.xml"):
              r = ET.parse(f).getroot()
              tests += int(r.get("tests", 0)); fails += int(r.get("failures", 0)) + int(r.get("errors", 0))
              for tc in r.iter("testcase"):
                  for bad in list(tc.iter("failure")) + list(tc.iter("error")):
                      msg = (bad.get("message") or "")[:300].replace("\n", " ")
                      print(f"::error title={tc.get('classname')}.{tc.get('name')}::{msg}")
          print(f"::notice title=Android unit tests::{tests} run, {fails} failed")
          PY

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AI-Fraud-Detector.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Fraud-Detector-apk
          path: AI-Fraud-Detector.apk

      - name: Publish to the "android-latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view android-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create android-latest --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "Android app (latest build)" \
              --notes "Install: open this page on an Android phone, download AI-Fraud-Detector.apk, allow installing from this source. See android/README.md."
          fi
          gh release upload android-latest AI-Fraud-Detector.apk --repo "$GITHUB_REPOSITORY" --clobber
          echo "::notice title=APK published::https://github.com/$GITHUB_REPOSITORY/releases/download/android-latest/AI-Fraud-Detector.apk (build ${GITHUB_RUN_NUMBER}, ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7})"
