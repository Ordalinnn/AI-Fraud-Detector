<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AI Fraud Detector</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="loading">
  <header>
    <img src="icons/icon48.png" alt="">
    <div class="headerText">
      <div id="appTitle" class="title">AI Fraud Detector</div>
      <div id="appSubtitle" class="subtitle">Runs locally — nothing leaves your device</div>
    </div>
    <select id="langSelect" class="langSelect" aria-label="Language">
      <option value="kz">🇰🇿 KZ</option>
      <option value="ru">🇷🇺 RU</option>
      <option value="en">🇬🇧 EN</option>
    </select>
  </header>

  <textarea id="input" placeholder="Paste a suspicious SMS, message, or call transcript…"></textarea>
  <div id="validationMsg" class="validation-msg hidden" role="alert"></div>
  <button id="analyzeBtn">🚀 Analyze</button>

  <div id="result" class="result hidden" role="status" aria-live="polite">
    <div id="riskBanner" class="risk-banner"></div>
    <div id="advice" class="advice"></div>
    <div id="modelWords" class="model-words hidden"></div>
    <ul id="reasons" class="reasons"></ul>
    <ul id="domains" class="domains"></ul>
    <button id="mistakeBtn" class="secondary-btn" type="button"></button>
    <div id="mistakeThanks" class="mistake-thanks hidden" role="status"></div>
  </div>

  <label class="autoscan">
    <input type="checkbox" id="autoscan" checked>
    <span id="autoscanLabel">Automatically check new messages in WhatsApp Web, Telegram Web and Gmail</span>
  </label>
  <div id="scanStatus" class="scan-status"></div>

  <div id="mistakesBox" class="mistakes-box hidden">
    <div id="mistakesTitle" class="mistakes-title"></div>
    <div class="mistakes-actions">
      <button id="mistakesDownload" class="secondary-btn" type="button"></button>
      <button id="mistakesClear" class="link-btn" type="button"></button>
    </div>
    <div id="mistakesNote" class="mistakes-note"></div>
  </div>

  <footer id="footerText">The same model as the website (6 models + stacking), run on your device — not a certified security tool.</footer>

  <script src="i18n.js"></script>
  <script src="mistakes.js"></script>
  <script src="normalize.js"></script>
  <script src="scorer.js"></script>
  <script src="ensemble.js"></script>
  <script src="detector.js"></script>
  <script src="popup.js"></script>
</body>
</html>
